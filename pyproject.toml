[project]
name = "neurovision"
version = "0.1.0"
description = "Channel-wise mutual information for resting-state EEG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mne>=1.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "streamlit>=1.32",
]

[project.scripts]
neurovision = "neurovision.cli:main"

[project.optional-dependencies]
# torch is ~1 GB, so it is opt-in: only the `mine` subcommand needs it.
mine = ["torch>=2.2"]
dev = ["pytest>=8.0", "torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
